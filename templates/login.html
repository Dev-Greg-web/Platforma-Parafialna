{% extends "base.html" %}
{% block title %}System Ministranci - Logowanie{% endblock %}

{% block content %}
<div class="flex-grow flex items-center justify-center p-4 min-h-screen">
    
    <div class="w-full max-w-md bg-cardbg rounded-3xl shadow-2xl overflow-hidden flex flex-col">
        
        <div class="flex text-white font-bold text-center cursor-pointer bg-black/20">
            <div id="tab-login" onclick="showLogin()" class="flex-1 py-4 bg-brand transition-colors">Logowanie</div>
            <div id="tab-register" onclick="showRegister()" class="flex-1 py-4 hover:bg-brand/50 transition-colors text-gray-300">Rejestracja</div>
        </div>

        <div id="form-login" class="p-8 flex flex-col bg-white dark:bg-[#1f2a44] transition-colors duration-300">
            <form action="/auth_process" method="post" class="flex flex-col gap-5">
                <div class="flex flex-col gap-2">
                    <label class="text-brand dark:text-white font-bold">Nazwa Użytkownika:</label>
                    <input type="text" name="username" required class="p-3 rounded-xl border border-gray-300 dark:border-brand bg-gray-50 dark:bg-[#2a3a5a] dark:text-white focus:ring-2 focus:ring-brand outline-none transition">
                </div>
                
                <div class="flex flex-col gap-2 relative">
                    <label class="text-brand dark:text-white font-bold">Hasło:</label>
                    <div class="relative w-full">
                        <input type="password" name="haslo" id="haslo-log" required class="p-3 w-full rounded-xl border border-gray-300 dark:border-brand bg-gray-50 dark:bg-[#2a3a5a] dark:text-white focus:ring-2 focus:ring-brand outline-none transition pr-12">
                        <button type="button" onclick="togglePass('haslo-log', 'eye-log')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-brand transition focus:outline-none">
                            <svg id="eye-log" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <a href="{{ url_for('forget_password') }}" class="text-sm text-gray-500 hover:text-brand transition">Zapomniałeś hasła?</a>
                
                <button type="submit" name="action" value="login" class="mt-4 bg-[#303f9f] hover:bg-brand text-white font-bold py-4 rounded-xl shadow-lg hover:-translate-y-1 transition">
                    Zaloguj się!
                </button>
            </form>
        </div>

        <div id="form-register" class="p-8 flex flex-col bg-cardbg hidden">
            <form action="/auth_process" method="post" id="reg-form" class="flex flex-col gap-4">
                
                <input type="hidden" id="geo_lat" name="latitude" value="">
                <input type="hidden" id="geo_lng" name="longitude" value="">

                <div class="flex flex-col gap-1">
                    <label class="text-white font-semibold">Imię:</label>
                    <input type="text" name="imie" required class="p-3 rounded-xl bg-white text-black outline-none focus:ring-4 focus:ring-brand/50 transition">
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-white font-semibold">Nazwisko:</label>
                    <input type="text" name="nazwisko" required class="p-3 rounded-xl bg-white text-black outline-none focus:ring-4 focus:ring-brand/50 transition">
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-white font-semibold">Nazwa Użytkownika:</label>
                    <input type="text" name="username" required class="p-3 rounded-xl bg-white text-black outline-none focus:ring-4 focus:ring-brand/50 transition">
                </div>
                
                <div class="flex flex-col gap-1 relative">
                    <label class="text-white font-semibold">Hasło:</label>
                    <div class="relative w-full">
                        <input type="password" name="haslo" id="haslo-reg" required class="p-3 w-full rounded-xl bg-white text-black outline-none focus:ring-4 focus:ring-brand/50 transition pr-12">
                        <button type="button" onclick="togglePass('haslo-reg', 'eye-reg')" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-brand transition focus:outline-none">
                            <svg id="eye-reg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <button type="button" onclick="wymusGPSiZarejestruj()" class="mt-4 bg-white text-brand font-bold py-4 rounded-xl shadow-lg hover:-translate-y-1 transition">
                    Zarejestruj się
                </button>
            </form>
        </div>

        <footer class="text-center py-4 text-xs font-bold bg-white dark:bg-[#1f2a44] text-gray-500 transition-colors" id="login-footer">
            &copy All rights reserved, Grześ Gładysz 2026
        </footer>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function showLogin() {
        document.getElementById('form-login').classList.remove('hidden');
        document.getElementById('form-register').classList.add('hidden');
        document.getElementById('tab-login').className = "flex-1 py-4 bg-brand transition-colors text-white";
        document.getElementById('tab-register').className = "flex-1 py-4 hover:bg-brand/50 transition-colors text-gray-300";
        document.getElementById('login-footer').classList.remove('hidden');
    }
    
    function showRegister() {
        document.getElementById('form-login').classList.add('hidden');
        document.getElementById('form-register').classList.remove('hidden');
        document.getElementById('tab-register').className = "flex-1 py-4 bg-brand transition-colors text-white";
        document.getElementById('tab-login').className = "flex-1 py-4 hover:bg-brand/50 transition-colors text-gray-300";
        document.getElementById('login-footer').classList.add('hidden');
    }

    // MAGIA OKA: Odkrywanie i chowanie hasła
    function togglePass(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (input.type === 'password') {
            input.type = 'text';
            icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
        } else {
            input.type = 'password';
            icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
        }
    }

    function wymusGPSiZarejestruj() {
        if (!navigator.geolocation) {
            alert("Twoja przeglądarka nie obsługuje geolokalizacji. Rejestracja jest niemożliwa.");
            return;
        }
    
        // Wywołujemy pobranie pozycji
        navigator.geolocation.getCurrentPosition(
            function(position) {
                // SUKCES: Użytkownik kliknął "Zezwól"
                document.getElementById('geo_lat').value = position.coords.latitude;
                document.getElementById('geo_lng').value = position.coords.longitude;
                
                // Dodajemy akcję i wysyłamy formularz
                const form = document.getElementById('reg-form');
                const hiddenAction = document.createElement('input');
                hiddenAction.type = 'hidden';
                hiddenAction.name = 'action';
                hiddenAction.value = 'register';
                form.appendChild(hiddenAction);
                
                form.submit();
            },
            function(error) {
                // PORAŻKA: Użytkownik kliknął "Blokuj" lub odrzucił uprawnienia
                if (error.code === error.PERMISSION_DENIED) {
                    alert(
                        "❌ REJESTRACJA ZABLOKOWANA!\n\n" +
                        "Kliknąłeś 'Blokuj'. Bez dostępu do GPS nie możesz założyć konta.\n\n" +
                        "JAK TO NAPRAWIĆ:\n" +
                        "1. Kliknij ikonę kłódeczki/suwaków na górnym pasku adresu (obok nazwy strony).\n" +
                        "2. Zmień uprawnienia 'Lokalizacja' na 'Zezwalaj' (lub Włącz).\n" +
                        "3. Odśwież stronę i spróbuj ponownie!"
                    );
                } else {
                    alert("Wystąpił błąd podczas próby pobrania GPS. Spróbuj ponownie za chwilę.");
                }
            },
            {
                enableHighAccuracy: true, // Wymusza dokładny GPS z telefonu, a nie przybliżony
                timeout: 5000
            }
        );
    }

    const isSuccess = "{{ 'true' if success_login else 'false' }}" === "true";
    if (isSuccess) {
        setTimeout(function() {
            window.location.href = "{{ url_for('dashboard_page') }}";
        }, 2000); 
    }
</script>
{% endblock %}
