{% extends "base.html" %}
{% block title %}Weryfikacja 2FA{% endblock %}

{% block content %}
<div class="flex-grow flex items-center justify-center p-4 min-h-screen">
    <div class="w-full max-w-md bg-[#1f2a44] rounded-3xl shadow-2xl p-8 flex flex-col text-white text-center">
        <h2 class="text-2xl font-bold mb-4 text-brand">Weryfikacja Dwuetapowa (2FA)</h2>
        <p class="text-sm text-gray-300 mb-6">
            Wysłaliśmy 12-cyfrowy kod bezpieczeństwa na Twój adres e-mail admina. Wpisz go poniżej, aby potwierdzić tożsamość.
        </p>
        
        <form action="/verify-2fa" method="post" class="flex flex-col gap-5">
            <div class="flex flex-col gap-2 text-left">
                <label class="font-bold text-gray-300">Wpisz kod 2FA:</label>
                <input type="text" name="kod_2fa" required placeholder="XXXXXXXXXXXX" maxlength="12" class="p-3 text-center tracking-widest font-mono rounded-xl bg-[#2a3a5a] text-white border border-brand outline-none focus:ring-2 focus:ring-brand transition">
            </div>
            
            <button type="submit" class="mt-2 bg-brand hover:bg-brand/80 text-white font-bold py-4 rounded-xl shadow-lg transition">
                Potwierdź i wejdź
            </button>
        </form>
    </div>
</div>
{% endblock %}
